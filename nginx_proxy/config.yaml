version: 2dd9342
hassio_api: true
slug: nginx_proxy
name: NGINX Home Assistant SSL proxy
description: An SSL/TLS proxy
url: https://github.com/home-assistant/app-nginx-proxy
arch:
- aarch64
- amd64
image: ghcr.io/home-assistant/app-nginx-proxy
init: false
map:
- ssl
- share
options:
  domain: null
  hsts: max-age=31536000; includeSubDomains
  certfile: fullchain.pem
  keyfile: privkey.pem
  cloudflare: false
  use_ssl_backend: false
  client_max_body_size_megabytes: 1
  customize:
    active: false
    default: nginx_proxy_default*.conf
    servers: nginx_proxy/*.conf
  real_ip_from: []
ports:
  443/tcp: 443
  443/udp: null
  80/tcp: null
schema:
  domain: str
  hsts: str
  certfile: str
  keyfile: str
  cloudflare: bool
  use_ssl_backend: bool
  client_max_body_size_megabytes: int(0,)
  customize:
    active: bool
    default: str
    servers: str
  real_ip_from:
  - str
